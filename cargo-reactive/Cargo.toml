[package]
name = "cargo-reactive"
version = "0.1.0"
edition = "2024"
description = "Create, build and run reactive apps on every platform."

[[bin]]
name = "cargo-reactive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
