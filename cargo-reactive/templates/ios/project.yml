# Generated by `cargo reactive` from [package.metadata.reactive].
# Turned into an Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen).
name: {{xcode_name}}
options:
  bundleIdPrefix: {{identifier}}
  deploymentTarget:
    iOS: "{{deployment_target}}"
settings:
  base:
    MARKETING_VERSION: "{{version}}"
    CURRENT_PROJECT_VERSION: "{{build_number}}"
targets:
  {{xcode_name}}:
    type: application
    platform: iOS
    sources:
      - main.m
{{icon_source}}    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{identifier}}
        PRODUCT_NAME: {{xcode_name}}
        DEVELOPMENT_TEAM: "{{development_team}}"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        LIBRARY_SEARCH_PATHS: "$(DERIVED_FILE_DIR)/rust"
        OTHER_LDFLAGS: "-l{{lib_name}} -liconv"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
{{icon_setting}}    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: QuartzCore.framework
    preBuildScripts:
      - name: Build Rust
        script: '"${PROJECT_DIR}/build-rust.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "{{app_name}}"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: ReactiveSceneDelegate
schemes:
  {{xcode_name}}:
    build:
      targets:
        {{xcode_name}}: all
    run:
      config: Debug
