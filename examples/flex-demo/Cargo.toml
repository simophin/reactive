[package]
name = "flex-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib is the Android library (`libflex_demo.so`), staticlib the iOS one.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
gtk = ["reactive/gtk"]

[dependencies]
reactive = { path = "../../reactive", features = ["tokio"] }
tokio = { version = "1.52.2", features = ["time"] }
tracing-subscriber = "0.3.23"
dotenvy = "0"

[package.metadata.reactive]
name = "Flex Demo"
identifier = "com.reactive.flexdemo"

[package.metadata.reactive.android]
min_sdk = 26
